[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "photonics-twin"
version = "0.1.0"
description = "SPEAR Photonics Digital Twin — feasibility prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "websockets>=13.1",
    "pytest-asyncio>=0.24",
]

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.build-type = "Release"
wheel.packages = ["src/photonics_core", "src/backend/photonics_twin_app"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"
