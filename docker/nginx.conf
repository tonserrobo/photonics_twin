server {
  listen 80;

  # Docker's embedded DNS. The upstream MUST go through a variable: with a literal
  # hostname nginx resolves it once at startup and hard-fails ("host not found in
  # upstream") if the backend isn't resolvable yet — taking the static UI down with
  # it. Via a variable, lookup happens per request, so a missing backend degrades to
  # a 502 on API calls instead of killing the server.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8000;

  location /healthz   { proxy_pass $backend$request_uri; }
  location /simulate/ { proxy_pass $backend$request_uri; }
  location /mock/     { proxy_pass $backend$request_uri; }

  location /ws/ {
    proxy_pass $backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
