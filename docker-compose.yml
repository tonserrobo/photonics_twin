services:
  backend:
    image: photonics-twin-backend:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
  frontend:
    image: photonics-twin-frontend:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
